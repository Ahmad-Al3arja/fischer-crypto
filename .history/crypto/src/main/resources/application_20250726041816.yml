spring:
  application:
    name: investment-platform
  
  # Database Configuration - Fixed for better compatibility
  datasource:
    url: jdbc:mysql://localhost:3306/investment_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # Connection pool settings for better stability
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      validation-timeout: 5000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
  
  # JPA Configuration - Enhanced for debugging
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true  # Enable to see SQL queries
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        connection:
          characterEncoding: utf8mb4
          useUnicode: true
        # Enhanced debugging
        generate_statistics: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Internationalization Support
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true
  
  # Add Arabic locale support
  web:
    locale: ar_SA

  # HTTP Encoding for Arabic Support
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # Flyway Configuration - Safer settings
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false  # Disable for development
    out-of-order: false
    clean-disabled: false
    locations: classpath:db/migration
    table: flyway_schema_history
    encoding: UTF-8

# Server Configuration
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # Enhanced error handling
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Enhanced Logging Configuration for debugging
logging:
  level:
    com.crypto.crypto: DEBUG
    com.crypto.crypto.security: DEBUG
    com.crypto.crypto.service: DEBUG
    com.crypto.crypto.controller: DEBUG
    com.crypto.crypto.repository: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc.core: DEBUG
    org.springframework.transaction: DEBUG
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Application Specific Configuration - Enhanced
app:
  # JWT Configuration - More secure
  jwt:
    # IMPORTANT: Use a strong secret key (minimum 32 characters)
    secret: ${JWT_SECRET:investmentPlatform2024SecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast32Characters}
    expiration: 86400000 # 24 hours
  
  # Platform Configuration
  platform:
    usdt-wallet: "TQn9Y2khEsLJW1ChVWFMSMeRDow5KcbLSE"
    base-url: "http://localhost:8080"  # Changed for development
    maintenance-mode: false
    default-locale: ar-SA
    supported-locales: ar-SA,en-US
    
  # Business Rules Configuration
  business:
    # Withdrawal Settings
    withdrawal:
      min-amount: 10.00
      max-amount: 50000.00
      fee-percentage: 12.00
      daily-limit: 10000.00
    
    # Referral Settings
    referral:
      direct-commission-rate: 0.12  # 12%
      grand-commission-rate: 0.06   # 6%
      default-usage-limit: 100
      max-usage-limit: 10000
    
    # Daily Counter Settings
    counter:
      duration-hours: 24
      auto-completion-enabled: true
      progressive-profit-days: 30
    
    # Auto Upgrade Settings
    upgrade:
      enabled: true
      freeze-capital: true
    
    # Security Settings
    security:
      max-login-attempts: 5
      lockout-duration-minutes: 30
      password-min-length: 6
    
  # API Response Settings
  response:
    default-language: ar
    include-timestamp: true
    include-path: true

# Management Endpoints (for monitoring and debugging)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans
  endpoint:
    health:
      show-details: always
    env:
      show-values: always

# Development specific settings
debug: false

# Additional debugging configuration
trace: false