# application.yml - Complete Configuration
spring:
  application:
    name: investment-platform
  
  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/investment_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        connection:
          characterEncoding: utf8mb4
          useUnicode: true

  # Internationalization Support
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true

  # HTTP Encoding for Arabic Support
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: false
    clean-disabled: false
    locations: classpath:db/migration
    table: flyway_schema_history
    encoding: UTF-8

# Server Configuration
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Logging Configuration
logging:
  level:
    com.crypto.crypto.security: DEBUG
    org.springframework.security: DEBUG
    com.crypto.crypto.service: INFO
    root: INFO

# Application Specific Configuration
app:
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:}  # Must be set via environment variable
    expiration: 86400000 # 24 hours
  
  # Platform Configuration
  platform:
    usdt-wallet: "TQn9Y2khEsLJW1ChVWFMSMeRDow5KcbLSE"
    base-url: "https://yourapp.com"
    maintenance-mode: false
    default-locale: ar-SA
    supported-locales: ar-SA,en-US
    
  # Business Rules Configuration
  business:
    # Withdrawal Settings
    withdrawal:
      min-amount: 10.00
      max-amount: 50000.00
      fee-percentage: 2.00
      daily-limit: 10000.00
    
    # Referral Settings
    referral:
      direct-commission-rate: 0.12  # 12%
      grand-commission-rate: 0.06   # 6%
      default-usage-limit: 100
      max-usage-limit: 10000
    
    # Daily Counter Settings
    counter:
      duration-hours: 24
      auto-completion-enabled: true
      progressive-profit-days: 30
    
    # Auto Upgrade Settings
    upgrade:
      enabled: true
      freeze-capital: true
    
    # Security Settings
    security:
      max-login-attempts: 5
      lockout-duration-minutes: 30
      password-min-length: 6
    
  # API Response Settings
  response:
    default-language: ar
    include-timestamp: true
    include-path: true

# Management Endpoints (for monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized