# Production Configuration
spring:
  application:
    name: investment-platform
  
  # Database Configuration - Production
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:investment_platform}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA Configuration - Production
  jpa:
    hibernate:
      ddl-auto: validate  # Never auto-create tables in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        connection:
          characterEncoding: utf8mb4
          useUnicode: true

  # Internationalization Support
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true

  # HTTP Encoding for Arabic Support
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # Flyway Configuration - Production
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true  # Never allow clean in production
    locations: classpath:db/migration
    table: flyway_schema_history
    encoding: UTF-8

# Server Configuration - Production
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Logging Configuration - Production
logging:
  level:
    com.crypto.crypto.security: WARN
    org.springframework.security: WARN
    com.crypto.crypto.service: INFO
    root: WARN
  file:
    name: logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Application Specific Configuration - Production
app:
  # JWT Configuration - Production
  jwt:
    secret: ${JWT_SECRET:}  # Must be set in production
    expiration: 86400000 # 24 hours
  
  # Platform Configuration - Production
  platform:
    usdt-wallet: ${PLATFORM_USDT_WALLET:TQn9Y2khEsLJW1ChVWFMSMeRDow5KcbLSE}
    base-url: ${PLATFORM_BASE_URL:https://yourapp.com}
    maintenance-mode: ${MAINTENANCE_MODE:false}
    default-locale: ar-SA
    supported-locales: ar-SA,en-US
    
  # Business Rules Configuration
  business:
    # Withdrawal Settings
    withdrawal:
      min-amount: 10.00
      max-amount: 50000.00
      fee-percentage: 2.00
      daily-limit: 10000.00
    
    # Referral Settings
    referral:
      direct-commission-rate: 0.12  # 12%
      grand-commission-rate: 0.06   # 6%
      default-usage-limit: 100
      max-usage-limit: 10000
    
    # Daily Counter Settings
    counter:
      duration-hours: 24
      auto-completion-enabled: true
      progressive-profit-days: 30
    
    # Auto Upgrade Settings
    upgrade:
      enabled: true
      freeze-capital: true
    
    # Security Settings
    security:
      max-login-attempts: 5
      lockout-duration-minutes: 30
      password-min-length: 6
    
  # API Response Settings
  response:
    default-language: ar
    include-timestamp: true
    include-path: false  # Don't expose paths in production

# Management Endpoints - Production (limited)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never 