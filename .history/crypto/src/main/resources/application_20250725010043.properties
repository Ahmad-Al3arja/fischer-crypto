spring:
  application:
    name: investment-platform
  
  datasource:
    url: jdbc:mysql://localhost:3306/investment_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        connection:
          characterEncoding: utf8mb4
          useUnicode: true

  # Internationalization support
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true

  # HTTP encoding support for Arabic
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: false
    clean-disabled: false
    locations: classpath:db/migration
    table: flyway_schema_history
    encoding: UTF-8

logging:
  level:
    com.crypto.crypto.security: DEBUG
    org.springframework.security: DEBUG
    com.crypto.crypto.service: INFO

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  jwt:
    secret: ${JWT_SECRET:mySecretKey1234567890123456789012345678901234567890}
    expiration: 86400000 # 24 hours
  
  platform:
    usdt-wallet: "TQn9Y2khEsLJW1ChVWFMSMeRDow5KcbLSE"
    maintenance-mode: false
    default-locale: ar-SA
    supported-locales: ar-SA,en-US

  # API Response settings
  response:
    default-language: ar
    include-timestamp: true
    include-path: true
